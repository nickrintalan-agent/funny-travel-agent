name: Deploy and Evaluate Captain Layover Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.12"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Automated Unit Tests (Rubric Verification)
        run: uv run pytest tests/unit -v

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

  deploy-cloud-run:
    needs: test-and-evaluate
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: funny-travel-agent
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          source: .
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            GOOGLE_GENAI_USE_VERTEXAI=TRUE
